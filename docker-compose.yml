services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pipeforge
      POSTGRES_PASSWORD: pipeforge
      POSTGRES_DB: pipeforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeforge"]
      interval: 5s
      timeout: 5s
      retries: 5
